<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Board List with Auto-Cleanup</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; display: flex; height: 100vh; background: #f8f9fa; }

    /* Sidebar for Room Discovery */
    #sidebar {
      width: 280px;
      background: #ffffff;
      border-right: 1px solid #e9ecef;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Main Board Display */
    #main-content {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    button {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0b5ed7; }

    ul { list-style: none; padding: 0; margin: 0; }
    li {
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #f1f3f5;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    li a { color: #0d6efd; text-decoration: none; font-weight: 500; }
    li a:hover { text-decoration: underline; }
    .badge { background: #28a745; color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Active Boards</h2>
    <button id="create-board-btn">Host New Board</button>
    <ul id="board-list">
      <li style="color: #6c757d;">Loading active boards...</li>
    </ul>
  </div>

  <div id="main-content">
    <h1 id="current-status">Viewer Mode</h1>
    <p id="board-info">Select an active board from the sidebar or host your own.</p>
  </div>

  <!-- Import Firebase JS SDKs as ES Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      onValue, 
      onDisconnect, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // 1. YOUR FIREBASE CONFIGURATION
    // Replace with your project details from the Firebase Console
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const boardListEl = document.getElementById('board-list');
    const createBtn = document.getElementById('create-board-btn');
    const currentStatus = document.getElementById('current-status');
    const boardInfo = document.getElementById('board-info');

    // 2. LISTEN FOR ACTIVE BOARDS IN REAL-TIME
    const activeBoardsRef = ref(db, 'active_boards');

    onValue(activeBoardsRef, (snapshot) => {
      boardListEl.innerHTML = '';
      const boards = snapshot.val();

      if (!boards) {
        boardListEl.innerHTML = '<li style="color: #6c757d;">No live boards. Be the first to host!</li>';
        return;
      }

      // Render each active board ID to the sidebar list
      Object.keys(boards).forEach((boardId) => {
        const boardData = boards[boardId];
        const li = document.createElement('li');
        
        const isCurrentBoard = window.location.hash === `#${boardId}`;
        
        li.innerHTML = `
          <a href="#${boardId}">${boardData.name || boardId}</a>
          ${isCurrentBoard ? '<span class="badge">You</span>' : ''}
        `;
        boardListEl.appendChild(li);
      });
    });

    // 3. HOST A BOARD WITH AUTOMATIC DISCONNECTION CLEANUP
    async function registerHostBoard() {
      // Generate a unique board ID
      const boardId = 'board-' + Math.random().toString(36).substr(2, 6);
      window.location.hash = boardId;

      const myBoardRef = ref(db, `active_boards/${boardId}`);

      // A. Instruct Firebase server to DELETE this board reference if the socket drops
      await onDisconnect(myBoardRef).remove();

      // B. Write the board entry to the active_boards collection
      await set(myBoardRef, {
        name: `Board #${boardId.split('-')[1]}`,
        createdAt: serverTimestamp()
      });

      // Update UI
      currentStatus.innerText = "Hosting Board: " + boardId;
      boardInfo.innerText = "Your board is live in the sidebar for all viewers! If you close this tab, it will auto-delete instantly.";
    }

    // 4. ROUTING & BUTTON LISTENERS
    createBtn.addEventListener('click', () => {
      registerHostBoard();
    });

    // Listen for Hash changes when a user clicks a room link in the sidebar
    window.addEventListener('hashchange', () => {
      const currentHash = window.location.hash.substring(1);
      if (currentHash) {
        currentStatus.innerText = "Viewing Board: " + currentHash;
        boardInfo.innerText = "Connected to live stream for " + currentHash;
      }
    });
  </script>
</body>
</html>
