<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebRTC DataChannel Hello World</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 60px; margin: 10px 0; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>WebRTC "Hello World" (Single Tab P2P)</h1>
    
    <div class="box">
        <h3>Step 1: Initialization</h3>
        <button id="startButton">1. Create Local Peer</button>
    </div>

    <div class="box">
        <h3>Step 2: The Handshake (Signaling Simulation)</h3>
        <label>Copy Local Offer/Answer SDP from here:</label>
        <textarea id="localSdp" readonly placeholder="Generated SDP will appear here..."></textarea>
        
        <label>Paste Remote SDP here:</label>
        <textarea id="remoteSdp" placeholder="Paste the SDP from the other peer here..."></textarea>
        
        <button id="answerButton" disabled>2. Create Answer (If pasting an Offer)</button>
        <button id="connectButton" disabled>3. Accept Answer (If pasting an Answer)</button>
    </div>

    <div class="box">
        <h3>Step 3: Chat (Direct P2P Data Channel)</h3>
        <input type="text" id="messageInput" placeholder="Type 'Hello World'..." disabled style="width: 70%; padding: 8px;">
        <button id="sendButton" disabled style="padding: 8px 15px;">Send</button>
        <div id="chatHistory" style="margin-top: 15px; white-space: pre-wrap; background: #eee; padding: 10px;"></div>
    </div>

    <script>
        let pc; // RTCPeerConnection object
        let dataChannel; // RTCDataChannel object

        // DOM elements
        const startButton = document.getElementById('startButton');
        const answerButton = document.getElementById('answerButton');
        const connectButton = document.getElementById('connectButton');
        const sendButton = document.getElementById('sendButton');
        const localSdpTxt = document.getElementById('localSdp');
        const remoteSdpTxt = document.getElementById('remoteSdp');
        const messageInput = document.getElementById('messageInput');
        const chatHistory = document.getElementById('chatHistory');

        // Optional configuration setup for STUN servers
        const configuration = { iceServers: [{ urls: 'stun:://google.com' }] };

        // --- STEP 1: INITIALIZE PEER ---
        startButton.onclick = async () => {
            pc = new RTCPeerConnection(configuration);

            // Set up local data channel (Initiator role)
            dataChannel = pc.createDataChannel("chat");
            setupDataChannelHandlers(dataChannel);

            // Handle incoming data channel (Receiver role)
            pc.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannelHandlers(dataChannel);
            };

            // Gather network routes (ICE Candidates)
            pc.onicecandidate = (event) => {
                if (!event.candidate) {
                    // ICE Gathering finished, display final SDP profile
                    localSdpTxt.value = JSON.stringify(pc.localDescription);
                }
            };

            // Generate the local Offer SDP profile
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            startButton.disabled = true;
            answerButton.disabled = false;
            connectButton.disabled = false;
        };

        // --- STEP 2: HANDSHAKE LOGIC ---
        // Option A: If you are the receiver, accept the offer and create an answer
        answerButton.onclick = async () => {
            const offerDesc = JSON.parse(remoteSdpTxt.value);
            await pc.setRemoteDescription(new RTCSessionDescription(offerDesc));
            
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
        };

        // Option B: If you are the initiator, accept the incoming answer
        connectButton.onclick = async () => {
            const answerDesc = JSON.parse(remoteSdpTxt.value);
            await pc.setRemoteDescription(new RTCSessionDescription(answerDesc));
        };

        // --- STEP 3: DATA CHANNEL HANDLERS ---
        function setupDataChannelHandlers(channel) {
            channel.onopen = () => {
                log("Data channel is OPEN and Ready!");
                messageInput.disabled = false;
                sendButton.disabled = false;
            };

            channel.onmessage = (event) => {
                log("Peer: " + event.data);
            };

            channel.onclose = () => {
                log("Data channel closed.");
            };
        }

        // --- STEP 4: SEND MESSAGE ---
        sendButton.onclick = () => {
            const text = messageInput.value;
            if (text && dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(text);
                log("Me: " + text);
                messageInput.value = '';
            }
        };

        function log(msg) {
            chatHistory.innerText += msg + "\n";
        }
    </script>
</body>
</html>
